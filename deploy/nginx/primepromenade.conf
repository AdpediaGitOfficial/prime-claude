# ─────────────────────────────────────────────────────────────
#  Prime Promenade — Nginx site config
#  3 subdomains: public site (static), admin (Node :4000), api (Node :5000)
#
#  Install:
#    sudo cp deploy/nginx/primepromenade.conf /etc/nginx/sites-available/primepromenade
#    sudo ln -s /etc/nginx/sites-available/primepromenade /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  TLS (after the server blocks below respond on :80):
#    sudo certbot --nginx -d primepromenade.com -d www.primepromenade.com \
#                        -d admin.primepromenade.com -d api.primepromenade.com
#  certbot rewrites these blocks to add the :443 + certificate lines.
# ─────────────────────────────────────────────────────────────

# ── Public site (static export from prime-source-code/out) ──
server {
    listen 80;
    server_name primepromenade.com www.primepromenade.com;

    root /var/www/primepromenade;   # copy prime-source-code/out here
    index index.html;

    # Next static export: clean URLs → /pool-booking → /pool-booking.html
    location / {
        try_files $uri $uri.html $uri/index.html /404.html;
    }

    # Hashed Next assets — cache hard
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}

# ── Admin dashboard (Next.js runtime on :4000) ──
server {
    listen 80;
    server_name admin.primepromenade.com;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ── Backend API (Express on :5000) ──
server {
    listen 80;
    server_name api.primepromenade.com;

    # Uploads can be up to 10 MB (multer limit)
    client_max_body_size 12M;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;   # so Express trust proxy sees https
    }
}
