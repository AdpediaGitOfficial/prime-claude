# ─────────────────────────────────────────────────────────────
#  Prime Promenade — TESTING config (single domain, path-based)
#  Everything under https://prime.adpedia.in:
#     /          → static site   (prime-source-code/out)
#     /admin     → admin app     (Node :4000, built with basePath=/admin)
#     /backend/  → backend API   (Node :5000, prefix stripped)
#
#  All three are same-origin, so there are no CORS concerns.
#  When moving to the real domain later, use primepromenade.conf instead
#  (subdomains) and rebuild the two Next apps with the new API base URL.
#
#  Install:
#    sudo cp deploy/nginx/prime.adpedia.in.conf /etc/nginx/sites-available/prime
#    sudo ln -s /etc/nginx/sites-available/prime /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#    sudo certbot --nginx -d prime.adpedia.in
# ─────────────────────────────────────────────────────────────

server {
    listen 80;
    server_name prime.adpedia.in;

    client_max_body_size 12M;   # allow 10 MB uploads via /backend/

    # ── Backend API (prefix stripped: /backend/listings → :5000/listings) ──
    location /backend/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Admin dashboard (Next.js with basePath=/admin) ──
    location /admin {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Public static site ──
    location / {
        root /var/www/prime;
        index index.html;
        try_files $uri $uri.html $uri/index.html /404.html;
    }

    location /_next/static/ {
        root /var/www/prime;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
